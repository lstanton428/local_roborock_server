name: Roborock Local Server (hardened)
version: "1.2.1-hardened.5"
slug: roborock_local_server
description: Private Roborock HTTPS and MQTT stack for Home Assistant environments.
url: "https://github.com/lstanton428/local_roborock_server"
image: "ghcr.io/lstanton428/local_roborock_server"
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
ports:
  555/tcp: 555
  8881/tcp: 8881
  3478/udp: null
  49160/udp: null
  49161/udp: null
  49162/udp: null
  49163/udp: null
  49164/udp: null
  49165/udp: null
  49166/udp: null
  49167/udp: null
  49168/udp: null
  49169/udp: null
  49170/udp: null
  49171/udp: null
  49172/udp: null
  49173/udp: null
  49174/udp: null
  49175/udp: null
  49176/udp: null
  49177/udp: null
  49178/udp: null
  49179/udp: null
ports_description:
  555/tcp: Roborock HTTPS API
  8881/tcp: Roborock MQTT TLS proxy
  3478/udp: TURN/STUN listener
  49160/udp: TURN media relay
  49161/udp: TURN media relay
  49162/udp: TURN media relay
  49163/udp: TURN media relay
  49164/udp: TURN media relay
  49165/udp: TURN media relay
  49166/udp: TURN media relay
  49167/udp: TURN media relay
  49168/udp: TURN media relay
  49169/udp: TURN media relay
  49170/udp: TURN media relay
  49171/udp: TURN media relay
  49172/udp: TURN media relay
  49173/udp: TURN media relay
  49174/udp: TURN media relay
  49175/udp: TURN media relay
  49176/udp: TURN media relay
  49177/udp: TURN media relay
  49178/udp: TURN media relay
  49179/udp: TURN media relay
map:
  # Only this add-on's own config folder (/config). Certificates are issued by the
  # add-on itself or placed in that folder; other add-ons' files are not mounted.
  - addon_config:rw
# webui can only use the hostname Home Assistant was opened with, never stack_fqdn,
# so Open Web UI goes through ingress to a page that opens the admin dashboard.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-vacuum
panel_title: Roborock
options:
  stack_fqdn: "api-roborock.example.com"
  https_port: 555
  mqtt_tls_port: 8881
  advertised_https_port: 0
  advertised_mqtt_tls_port: 0
  ingress_new_connections_controls: true
  ingress_routine_editor: true
  region: "us"
  log_max_size_mb: 10
  log_backup_count: 3
  tls_mode: "provided"
  tls_base_domain: ""
  tls_wildcard: false
  tls_extra_names: []
  tls_email: ""
  acme_server: "zerossl"
  acme_eab_kid: ""
  acme_eab_hmac_key: ""
  cloudflare_token: ""
  cert_file: ""
  key_file: ""
  admin_password: ""
  protocol_login_email: ""
  protocol_login_pin: ""
  new_connections_window_minutes: 30
  admin_allowed_networks: []
  mqtt_topic_acl: "audit"
  trusted_proxies: []
  turn_mode: "disabled"
  turn_host: ""
  turn_port: 3478
  turn_username: ""
  turn_password: ""
  turn_realm: ""
  turn_ttl: 86400
schema:
  stack_fqdn: str
  https_port: port
  mqtt_tls_port: port
  advertised_https_port: int
  advertised_mqtt_tls_port: int
  ingress_new_connections_controls: bool?
  ingress_routine_editor: bool?
  region: list(us|eu|cn|ru)
  log_max_size_mb: int(1,1024)?
  log_backup_count: int(0,20)?
  tls_mode: list(provided|cloudflare_acme)
  tls_base_domain: str
  tls_wildcard: bool?
  tls_extra_names:
    - str?
  tls_email: str
  acme_server: list(zerossl|actalis)
  acme_eab_kid: str
  acme_eab_hmac_key: password
  cloudflare_token: password
  cert_file: str
  key_file: str
  admin_password: password
  protocol_login_email: email
  protocol_login_pin: password
  new_connections_window_minutes: int(0,1440)?
  admin_allowed_networks:
    - str?
  mqtt_topic_acl: list(off|audit|enforce)?
  trusted_proxies:
    - str?
  turn_mode: list(disabled|provided|external)?
  turn_host: str?
  turn_port: port?
  turn_username: str?
  turn_password: password?
  turn_realm: str?
  turn_ttl: int?
